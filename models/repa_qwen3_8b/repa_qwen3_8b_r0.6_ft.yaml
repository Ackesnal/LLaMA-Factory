### model
cache_dir: $TMPDIR/hf_cache
model_name_or_path: /scratch/user/uqxxu16/LLaMA-Factory/models/repa_qwen3_8b/inferred_ratio0.6
trust_remote_code: true

### method
stage: pt
do_train: true
finetuning_type: freeze
freeze_trainable_layers: 32
freeze_trainable_modules: mlp.gate_scaler,mlp.down_proj.weight,post_attention_layernorm.weight,input_layernorm.weight
flash_attn: fa2

### dataset
dataset: c4_en
streaming: true
template: qwen3
cutoff_len: 2048
overwrite_cache: true
dataloader_num_workers: 20
dataloader_pin_memory: true

### output
output_dir: /scratch/user/uqxxu16/LLaMA-Factory/models/repa_qwen3_8b/finetuned_ratio0.6
logging_steps: 10
save_steps: 1000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb # choices: [none, wandb, tensorboard, swanlab, mlflow]
run_name: repa_qwen3_8b_ratio0.6_c4en_pt

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 2.0e-5
max_steps: 4096
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
fp16: false
ddp_timeout: 180000000
resume_from_checkpoint: null
gradient_checkpointing: false
optim: adamw_torch

### eval
val_size: 1000
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200

